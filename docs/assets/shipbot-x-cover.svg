<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a07"/>
      <stop offset="40%" stop-color="#0a1610"/>
      <stop offset="80%" stop-color="#06120b"/>
      <stop offset="100%" stop-color="#030704"/>
    </linearGradient>

    <!-- Radial Ambient Spotlights -->
    <radialGradient id="spot-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spot-right" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2016" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06130c" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1500" height="500" fill="url(#cover-bg)"/>
  <rect width="1500" height="500" fill="url(#spot-left)"/>
  <rect width="1500" height="500" fill="url(#spot-right)"/>

  <!-- Perspective Cyber Grid Lines (Digital Ocean / Blockchain Highway) -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1">
    <!-- Horizontal lines with perspective spacing -->
    <line x1="0" y1="480" x2="1500" y2="480"/>
    <line x1="0" y1="440" x2="1500" y2="440"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="0" y1="360" x2="1500" y2="360"/>
    <line x1="0" y1="310" x2="1500" y2="310"/>
    <line x1="0" y1="250" x2="1500" y2="250"/>
    <line x1="0" y1="180" x2="1500" y2="180"/>
    <line x1="0" y1="100" x2="1500" y2="100"/>

    <!-- Perspective vanishing lines toward horizon (750, 120) -->
    <line x1="0" y1="500" x2="680" y2="120"/>
    <line x1="200" y1="500" x2="700" y2="120"/>
    <line x1="400" y1="500" x2="720" y2="120"/>
    <line x1="600" y1="500" x2="740" y2="120"/>
    <line x1="800" y1="500" x2="760" y2="120"/>
    <line x1="1000" y1="500" x2="780" y2="120"/>
    <line x1="1200" y1="500" x2="800" y2="120"/>
    <line x1="1400" y1="500" x2="820" y2="120"/>
    <line x1="1500" y1="450" x2="830" y2="120"/>
  </g>

  <!-- Left Ambient Icon Silhouette (Avatar Safe-zone anchor) -->
  <g opacity="0.15" transform="translate(60, 180) scale(0.65)">
    <polygon points="120,40 20,240 220,240" fill="none" stroke="#10b981" stroke-width="6"/>
    <polygon points="120,80 50,220 190,220" fill="#10b981"/>
  </g>

  <!-- ================= LEFT / HERO CONTENT REGION (Offset for Avatar) ================= -->
  <g transform="translate(340, 0)">
    <!-- Top Verified Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="370" height="30" rx="15" fill="#082314" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="5" fill="#34d399"/>
      <circle cx="16" cy="15" r="9" fill="#34d399" opacity="0.3"/>
      <text x="32" y="19" 
            font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" 
            font-size="11.5" 
            font-weight="700" 
            letter-spacing="1" 
            fill="#a7f3d0">ANCHORED TO BOT CHAIN MAINNET (677)</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="-1" 
          fill="url(#title-grad)">ShipBot</text>

    <!-- Subtitle -->
    <text x="0" y="210" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="600" 
          fill="#e2e8f0">Release-Readiness Decisions Anchored On-Chain</text>

    <!-- Description Paragraph -->
    <text x="0" y="248" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="400" 
          fill="#94a3b8">
      <tspan x="0" dy="0">Combines automated TestSprite verification loops with deterministic</tspan>
      <tspan x="0" dy="22">SHA-256 snapshots published immutably to BOT Chain Mainnet.</tspan>
    </text>

    <!-- Capability Feature Badges Row -->
    <g transform="translate(0, 312)">
      <!-- Badge 1: QA Loops -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#0b1e14" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡️ TestSprite Loops</text>
      </g>
      <!-- Badge 2: SHA-256 -->
      <g transform="translate(178, 0)">
        <rect width="176" height="34" rx="8" fill="#0b1e14" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">🔒 SHA-256 Digest</text>
      </g>
      <!-- Badge 3: Smart Registry -->
      <g transform="translate(364, 0)">
        <rect width="186" height="34" rx="8" fill="#0b1e14" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">📜 Smart Registry</text>
      </g>
    </g>

    <!-- Footer Meta Coordinates -->
    <g transform="translate(0, 395)" opacity="0.75">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#64748b">
        <tspan fill="#34d399">● LIVE</tspan> shipshape-pi.vercel.app  •  github.com/Ololadestephen/Shipshape
      </text>
    </g>
  </g>

  <!-- ================= RIGHT / VERIFICATION HUD RECEIPT CARD ================= -->
  <g transform="translate(920, 65)">
    <!-- Outer Glass Card Container -->
    <rect width="520" height="365" rx="16" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.8"/>

    <!-- Card Header Bar -->
    <rect width="520" height="42" rx="16" fill="#0d2419" stroke="url(#card-border)" stroke-width="1"/>
    <!-- Terminal Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981" opacity="0.8"/>
    
    <text x="90" y="26" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#a7f3d0">SHIPBOT ON-CHAIN RECEIPT</text>

    <!-- Live Status Pill in Header -->
    <rect x="400" y="10" width="105" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <circle cx="414" cy="21" r="3.5" fill="#34d399"/>
    <text x="424" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="700" fill="#34d399">VERIFIED</text>

    <!-- Card Content Rows -->
    <g transform="translate(24, 62)">
      <!-- Row 1: Target URL -->
      <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">TARGET</text>
      <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#f1f5f9">https://shipshape-pi.vercel.app</text>

      <line x1="0" y1="46" x2="472" y2="46" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Row 2: Contract Address & Network -->
      <g transform="translate(0, 56)">
        <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">REGISTRY CONTRACT</text>
        <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#34d399">0x421b57ea0ab9aa3e9e0422244660be9507d42c12</text>
      </g>

      <line x1="0" y1="108" x2="472" y2="108" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Row 3: Fingerprint (SHA-256 Digest) -->
      <g transform="translate(0, 118)">
        <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">REPORT SNAPSHOT DIGEST (SHA-256)</text>
        <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#e2e8f0">0x8f7d4e2a19b84c30e71659a8...3b19c2a</text>
      </g>

      <line x1="0" y1="170" x2="472" y2="170" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Row 4: Network & Block Confirmation -->
      <g transform="translate(0, 180)">
        <g>
          <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">NETWORK</text>
          <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#34d399">BOT Chain Mainnet</text>
        </g>
        <g transform="translate(190, 0)">
          <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">CHAIN ID</text>
          <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#f1f5f9">677 (0x2a5)</text>
        </g>
        <g transform="translate(320, 0)">
          <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b">BLOCK #</text>
          <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#f1f5f9">29420702</text>
        </g>
      </g>

      <line x1="0" y1="230" x2="472" y2="230" stroke="#10b981" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Bottom Verdict Banner inside card -->
      <g transform="translate(0, 244)">
        <rect width="472" height="42" rx="8" fill="#042714" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="22" cy="21" r="5" fill="#34d399"/>
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
          RELEASE VERDICT: <tspan fill="#34d399">READY TO SHIP</tspan> (100% Core Checks Passed)
        </text>
      </g>
    </g>
  </g>
</svg>
